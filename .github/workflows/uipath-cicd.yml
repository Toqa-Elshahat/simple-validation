name: UiPath — Run Tests on Push

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main

env:
  ORCHESTRATOR_URL:    'https://cloud.uipath.com/'
  ORCHESTRATOR_TENANT: 'DefaultTenant'
  ORCHESTRATOR_ORG:    'toqaectwrkb'
  ORCHESTRATOR_FOLDER: 'Shared'

jobs:

# ============================================================
#  JOB 1 — PACK
# ============================================================
  pack:
    name: '📦 Pack Project'
    runs-on: windows-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UiPath CLI
        uses: Mikael-RnD/setup-uipath@v2

      - name: Pack Project
        run: |
          uipcli package pack project.json `
            -o "${{ github.workspace }}\packages" `
            --autoVersion
        shell: powershell

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name:           RpaPackage
          path:           ${{ github.workspace }}\packages\*.nupkg
          retention-days: 7

      - name: Debug Secrets
        run: |
          if ("${{ secrets.UIPATH_PAT }}" -eq "") {
            Write-Error "UIPATH_PAT is empty!"
          } else {
            Write-Host "UIPATH_PAT is set ✅"
          }
        shell: powershell

# ============================================================
#  JOB 2 — DEPLOY
# ============================================================
  deploy:
    name: '🚀 Deploy to Orchestrator'
    runs-on: windows-latest
    needs: pack
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UiPath CLI
        uses: Mikael-RnD/setup-uipath@v2

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: RpaPackage
          path: ${{ github.workspace }}\packages

      - name: Deploy to Orchestrator
        run: |
          $packagePath = (Get-ChildItem "${{ github.workspace }}\packages\*.nupkg" | Select-Object -First 1).FullName
          uipcli package deploy `
            "$packagePath" `
            "${{ env.ORCHESTRATOR_URL }}" `
            "${{ env.ORCHESTRATOR_TENANT }}" `
            --token "${{ secrets.UIPATH_PAT }}" `
            --accountName "${{ env.ORCHESTRATOR_ORG }}" `
            -o "${{ env.ORCHESTRATOR_FOLDER }}" `
            --traceLevel Information
        shell: powershell

# ============================================================
#  JOB 3 — RUN TESTS
# ============================================================
  run-tests:
    name: '🧪 Run Test Cases'
    runs-on: windows-latest
    needs: deploy
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UiPath CLI
        uses: Mikael-RnD/setup-uipath@v2

      - name: Create results directory
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\results"
        shell: powershell

      - name: Run Test Set in Orchestrator
        run: |
          uipcli test run `
            "${{ env.ORCHESTRATOR_URL }}" `
            "${{ env.ORCHESTRATOR_TENANT }}" `
            --token "${{ secrets.UIPATH_PAT }}" `
            --accountName "${{ env.ORCHESTRATOR_ORG }}" `
            -o "${{ env.ORCHESTRATOR_FOLDER }}" `
            -P "project.json" `
            --out junit `
            -r "${{ github.workspace }}\results\results.xml" `
            -w 300 `
            --attachRobotLogs true `
            --traceLevel Verbose
        shell: powershell

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ github.workspace }}\results\results.xml

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name:          'Test Results'
          path:          'results/results.xml'
          reporter:      java-junit
          fail-on-error: false
          token:         ${{ secrets.GITHUB_TOKEN }}

# ============================================================
#  JOB 4 — CREATE DEFECTS (Test Manager -> ADO connector)
# ============================================================
  create-defects:
    name: '🐞 Create ADO Defects for Failures'
    runs-on: windows-latest
    needs: run-tests
    # run whenever run-tests actually executed, whether it passed or failed,
    # but skip if it was skipped/cancelled upstream (e.g. deploy failed)
    if: always() && needs.run-tests.result != 'skipped' && needs.run-tests.result != 'cancelled'
    env:
      TM_PROJECT_KEY: ${{ secrets.TM_PROJECT_KEY }}
    steps:

      - name: Query failed logs and create defects via Test Manager API
        run: |
          $org        = "${{ env.ORCHESTRATOR_ORG }}"
          $tenant     = "${{ env.ORCHESTRATOR_TENANT }}"
          $projectKey = "${{ env.TM_PROJECT_KEY }}"

          # 1) token for the Test Manager resource — a separate external app
          #    (or a separate scopes pass on the same app) from the Orchestrator PAT above
          $tmToken = (Invoke-RestMethod -Method Post `
            -Uri "https://cloud.uipath.com/$org/identity_/connect/token" `
            -ContentType "application/x-www-form-urlencoded" `
            -Body @{
              grant_type    = "client_credentials"
              client_id     = "${{ secrets.UIPATH_TM_CLIENT_ID }}"
              client_secret = "${{ secrets.UIPATH_TM_SECRET }}"
              scope         = "TM.Projects TM.TestSets TM.TestExecutions"
            }).access_token

          $headers = @{ Authorization = "Bearer $tmToken" }
          $tmApi   = "https://cloud.uipath.com/$org/$tenant/testmanager_/api"

          # 2) find the execution that just ran and pull its per-case logs
          $execution = Invoke-RestMethod -Headers $headers `
            -Uri "$tmApi/testexecutions?projectKey=$projectKey&top=1&orderBy=finished desc"

          # only test cases with status Failed are kept here — passed cases
          # never reach the loop below, so only failures get defects filed
          $failedLogs = (Invoke-RestMethod -Headers $headers `
            -Uri "$tmApi/testexecutions/$($execution.id)/testcaselogs") |
            Where-Object { $_.status -eq "Failed" }

          if (-not $failedLogs -or $failedLogs.Count -eq 0) {
            Write-Host "No failed test cases in this execution — nothing to file."
            exit 0
          }

          # 3) create a defect per failure — Test Manager forwards this to ADO
          #    via the connector configured on the project (TM-01), with the
          #    execution log linked automatically
          foreach ($log in $failedLogs) {
            $body = @{
              testExecutionId = $execution.id
              testCaseId      = $log.testCaseId
              description     = "Automated run failed.`n`nFailure: $($log.failureMessage)`n`nLog: $tmApi/testexecutions/$($execution.id)/testcaselogs/$($log.id)"
            } | ConvertTo-Json

            Invoke-RestMethod -Headers $headers -Method Post `
              -Uri "$tmApi/testcaselogs/$($log.id)/defect" `
              -ContentType "application/json" -Body $body

            Write-Host "Defect filed in ADO for test case $($log.testCaseId)"
          }
        shell: powershell