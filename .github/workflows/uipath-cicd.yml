name: UiPath — Run Tests on Push

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main

env:
  ORCHESTRATOR_URL:    'https://cloud.uipath.com/'
  ORCHESTRATOR_TENANT: 'DefaultTenant'
  ORCHESTRATOR_ORG:    'toqaectwrkb'
  ORCHESTRATOR_FOLDER: 'Shared'

jobs:

# ============================================================
#  JOB 1 — PACK
# ============================================================
  pack:
    name: '📦 Pack Project'
    runs-on: windows-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UiPath CLI
        uses: Mikael-RnD/setup-uipath@v2

      - name: Pack Project
        run: |
          uipcli package pack project.json `
            -o "${{ github.workspace }}\packages" `
            --autoVersion
        shell: powershell

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name:           RpaPackage
          path:           ${{ github.workspace }}\packages\*.nupkg
          retention-days: 7

      - name: Debug Secrets
        run: |
          if ("${{ secrets.UIPATH_PAT }}" -eq "") {
            Write-Error "UIPATH_PAT is empty!"
          } else {
            Write-Host "UIPATH_PAT is set ✅"
          }
        shell: powershell

# ============================================================
#  JOB 2 — DEPLOY
# ============================================================
  deploy:
    name: '🚀 Deploy to Orchestrator'
    runs-on: windows-latest
    needs: pack
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UiPath CLI
        uses: Mikael-RnD/setup-uipath@v2

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: RpaPackage
          path: ${{ github.workspace }}\packages

      - name: Deploy to Orchestrator
        run: |
          $packagePath = (Get-ChildItem "${{ github.workspace }}\packages\*.nupkg" | Select-Object -First 1).FullName
          uipcli package deploy `
            "$packagePath" `
            "${{ env.ORCHESTRATOR_URL }}" `
            "${{ env.ORCHESTRATOR_TENANT }}" `
            --token "${{ secrets.UIPATH_PAT }}" `
            --accountName "${{ env.ORCHESTRATOR_ORG }}" `
            -o "${{ env.ORCHESTRATOR_FOLDER }}" `
            --traceLevel Information
        shell: powershell

# ============================================================
#  JOB 3 — RUN TESTS
# ============================================================
  run-tests:
    name: '🧪 Run Test Cases'
    runs-on: windows-latest
    needs: deploy
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UiPath CLI
        uses: Mikael-RnD/setup-uipath@v2

      - name: Create results directory
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\results"
        shell: powershell

      - name: Run Test Set in Orchestrator
        run: |
          uipcli test run `
            "${{ env.ORCHESTRATOR_URL }}" `
            "${{ env.ORCHESTRATOR_TENANT }}" `
            --token "${{ secrets.UIPATH_PAT }}" `
            --accountName "${{ env.ORCHESTRATOR_ORG }}" `
            -o "${{ env.ORCHESTRATOR_FOLDER }}" `
            -P "project.json" `
            --out junit `
            -r "${{ github.workspace }}\results\results.xml" `
            -w 300 `
            --attachRobotLogs true `
            --traceLevel Verbose
        shell: powershell

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ github.workspace }}\results\results.xml

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name:          'Test Results'
          path:          'results/results.xml'
          reporter:      java-junit
          fail-on-error: false
          token:         ${{ secrets.GITHUB_TOKEN }}

# ============================================================
#  JOB 4 — CREATE DEFECTS (Test Manager -> ADO connector)
# ============================================================
  create-defects:
    name: '🐞 Create ADO Defects for Failures'
    runs-on: windows-latest
    needs: run-tests
    # run whenever run-tests  actually executed, whether it passed or failed,
    # but skip if it was skipped/cancelled upstream (e.g. deploy failed)
    if: always() && needs.run-tests.result != 'skipped' && needs.run-tests.result != 'cancelled'
    steps:

      - name: Query failed logs and create defects via Test Manager API
        env:
          TM_PROJECT_NAME:     ${{ secrets.TM_PROJECT_NAME }}
          UIPATH_TM_CLIENT_ID: ${{ secrets.UIPATH_TM_CLIENT_ID }}
          UIPATH_TM_SECRET:    ${{ secrets.UIPATH_TM_SECRET }}
        run: |
          $org         = $env:ORCHESTRATOR_ORG
          $tenant      = $env:ORCHESTRATOR_TENANT
          $projectName = $env:TM_PROJECT_NAME

          # 1) exchange client_id/secret for a token scoped to Test Manager
          #    (this app needs TM.Projects / TM.TestSets / TM.TestExecutions
          #    under Application Scope(s), separate from the Orchestrator PAT)
          $tmBody = @{
            grant_type    = "client_credentials"
            client_id     = $env:UIPATH_TM_CLIENT_ID
            client_secret = $env:UIPATH_TM_SECRET
            scope         = "TM.Projects TM.TestSets TM.TestExecutions"
          }

          $tmToken = (Invoke-RestMethod -Method Post `
            -Uri "https://cloud.uipath.com/$org/identity_/connect/token" `
            -ContentType "application/x-www-form-urlencoded" `
            -Body $tmBody).access_token

          $headers = @{ Authorization = "Bearer $tmToken" }
          $tmApi   = "https://cloud.uipath.com/$org/$tenant/testmanager_/api/v2"

          # 2) resolve the Test Manager project's GUID from its name
          #    (the API takes a projectId GUID in the path, not a project key)
          $projectSearch = Invoke-RestMethod -Headers $headers `
            -Uri "$tmApi/projects?search=$projectName&top=50"

          $project = $projectSearch.data | Where-Object { $_.name -eq $projectName } | Select-Object -First 1
          if (-not $project) { $project = $projectSearch.data | Select-Object -First 1 }
          if (-not $project) {
            Write-Error "No Test Manager project found matching name '$projectName'"
            exit 1
          }
          $projectId = $project.id

          # 3) find the execution that just ran
          $executionSearch = Invoke-RestMethod -Headers $headers `
            -Uri "$tmApi/$projectId/testexecutions?top=1&orderby=created desc"

          $execution = $executionSearch.data | Select-Object -First 1
          if (-not $execution) {
            Write-Host "No test executions found for this project - nothing to file."
            exit 0
          }

          # 4) pull only the failed test case logs for that execution
          #    (onlyFailed filters server-side - passed cases never come back)
          $logsResult = Invoke-RestMethod -Headers $headers `
            -Uri "$tmApi/$projectId/testcaselogs/testexecution/$($execution.id)/paged?onlyFailed=true&top=200"

          $failedLogs = $logsResult.data

          if (-not $failedLogs -or $failedLogs.Count -eq 0) {
            Write-Host "No failed test cases in this execution - nothing to file."
            exit 0
          }

          # 5) create a defect per failure - Test Manager forwards this to ADO
          #    via the connector configured on the project (TM-01)
          foreach ($log in $failedLogs) {
            $body = @{
              testCaseId      = $log.testCaseId
              testExecutionId = $execution.id
            } | ConvertTo-Json

            Invoke-RestMethod -Headers $headers -Method Post `
              -Uri "$tmApi/$projectId/defects" `
              -ContentType "application/json" -Body $body

            Write-Host "Defect filed in ADO for test case $($log.testCaseId)"
          }
        shell: powershell