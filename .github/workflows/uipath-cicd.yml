name: UiPath — Run Tests on Push

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main

env:
  ORCHESTRATOR_URL:    'https://cloud.uipath.com/'
  ORCHESTRATOR_TENANT: 'DefaultTenant'
  ORCHESTRATOR_ORG:    'toqaectwrkb'
  ORCHESTRATOR_FOLDER: 'Shared'

jobs:

# ============================================================
#  JOB 1 — PACK
# ============================================================
  pack:
    name: 'Pack Project'
    runs-on: windows-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UiPath CLI
        uses: Mikael-RnD/setup-uipath@v2

      - name: Pack Project
        run: |
          uipcli package pack project.json `
            -o "${{ github.workspace }}\packages" `
            --autoVersion
        shell: powershell

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name:           RpaPackage
          path:           ${{ github.workspace }}\packages\*.nupkg
          retention-days: 7

      - name: Debug Secrets
        run: |
          if ("${{ secrets.UIPATH_PAT }}" -eq "") {
            Write-Error "UIPATH_PAT is empty!"
          } else {
            Write-Host "UIPATH_PAT is set"
          }
        shell: powershell

# ============================================================
#  JOB 2 — DEPLOY
# ============================================================
  deploy:
    name: 'Deploy to Orchestrator'
    runs-on: windows-latest
    needs: pack
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UiPath CLI
        uses: Mikael-RnD/setup-uipath@v2

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: RpaPackage
          path: ${{ github.workspace }}\packages

      - name: Deploy to Orchestrator
        run: |
          $packagePath = (Get-ChildItem "${{ github.workspace }}\packages\*.nupkg" | Select-Object -First 1).FullName
          uipcli package deploy `
            "$packagePath" `
            "${{ env.ORCHESTRATOR_URL }}" `
            "${{ env.ORCHESTRATOR_TENANT }}" `
            --token "${{ secrets.UIPATH_PAT }}" `
            --accountName "${{ env.ORCHESTRATOR_ORG }}" `
            -o "${{ env.ORCHESTRATOR_FOLDER }}" `
            --traceLevel Information
        shell: powershell

# ============================================================
#  JOB 3 — RUN TESTS
# ============================================================
  run-tests:
    name: 'Run Test Cases'
    runs-on: windows-latest
    needs: deploy
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UiPath CLI
        uses: Mikael-RnD/setup-uipath@v2

      - name: Create results directory
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\results"
        shell: powershell

      # continue-on-error: a failing TEST CASE makes uipcli exit 1, which would
      # otherwise fail the job before results are published and defects are filed.
      # The real pass/fail signal is surfaced by the "Publish Test Results" step.
      - name: Run Test Set in Orchestrator
      #  continue-on-error: true
        run: |
          uipcli test run `
            "${{ env.ORCHESTRATOR_URL }}" `
            "${{ env.ORCHESTRATOR_TENANT }}" `
            --accountForApp     "${{ env.ORCHESTRATOR_ORG }}" `
            --applicationId     "${{ secrets.UIPATH_TM_CLIENT_ID }}" `
            --applicationSecret "${{ secrets.UIPATH_TM_SECRET }}" `
            --applicationScope  "OR.Folders OR.Execution OR.Monitoring TM.Projects TM.TestSets TM.TestExecutions" `
            -o "${{ env.ORCHESTRATOR_FOLDER }}" `
            --projectKey "CPN" `
            --testsetkey "CPN:1" `
            --out junit `
            -r "${{ github.workspace }}\results\results.xml" `
            -w 300 `
            --attachRobotLogs true `
            --traceLevel Verbose
        shell: powershell

      # Inject Test Manager execution details + Orchestrator robot logs into the
      # JUnit results.xml, so the failure reason and logs show up in the report.
      - name: Enrich JUnit results
        if: always()
        env:
          ORCHESTRATOR_ORG:    ${{ env.ORCHESTRATOR_ORG }}
          ORCHESTRATOR_TENANT: ${{ env.ORCHESTRATOR_TENANT }}
          ORCHESTRATOR_FOLDER: ${{ env.ORCHESTRATOR_FOLDER }}
          TM_PROJECT_NAME:     ${{ secrets.TM_PROJECT_NAME }}
          UIPATH_TM_CLIENT_ID: ${{ secrets.UIPATH_TM_CLIENT_ID }}
          UIPATH_TM_SECRET:    ${{ secrets.UIPATH_TM_SECRET }}
          RESULTS_XML:         ${{ github.workspace }}\results\results.xml
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\enrich-junit.ps1"
        shell: powershell

      # Render the (enriched) JUnit XML into a standalone human-readable HTML
      # page. Because enrichment already put robot logs in <system-out> and the
      # assertion detail in <failure>, this HTML carries them too.
      - name: Render JUnit to HTML
        if: always()
        run: |
          npx --yes xunit-viewer@10 `
            --results="${{ github.workspace }}\results\results.xml" `
            --output="${{ github.workspace }}\results\results.html"
        shell: powershell

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            ${{ github.workspace }}\results\results.xml
            ${{ github.workspace }}\results\results.html

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name:          'Test Results'
          path:          'results/results.xml'
          reporter:      java-junit
          fail-on-error: false
          token:         ${{ secrets.GITHUB_TOKEN }}

# ============================================================
#  JOB 4 — CREATE DEFECTS (Test Manager -> ADO connector)
# ============================================================
  create-defects:
    name: 'Create ADO Defects for Failures'
    runs-on: windows-latest
    needs: run-tests
    # Run whenever run-tests actually executed, whether it passed or failed,
    # but skip if it was skipped/cancelled upstream (e.g. deploy failed)
    if: always() && needs.run-tests.result != 'skipped' && needs.run-tests.result != 'cancelled'
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Query failed logs and create defects via Test Manager API
        env:
          ORCHESTRATOR_ORG:    ${{ env.ORCHESTRATOR_ORG }}
          ORCHESTRATOR_TENANT: ${{ env.ORCHESTRATOR_TENANT }}
          TM_PROJECT_NAME:     ${{ secrets.TM_PROJECT_NAME }}
          UIPATH_TM_CLIENT_ID: ${{ secrets.UIPATH_TM_CLIENT_ID }}
          UIPATH_TM_SECRET:    ${{ secrets.UIPATH_TM_SECRET }}
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\create-defects.ps1"
        shell: powershell
